name: TripDataHub
options:
  minimumXcodeGenVersion: 2.44.0
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  TripDataHub:
    type: application
    platform: iOS
    sources:
      - path: TripDataHub
        excludes:
          - "**/*.md"
    resources:
      - path: TripDataHub/Resources/AdminPolicy.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule
        PRODUCT_NAME: TripDataHub
        MARKETING_VERSION: "1.3.3"
        CURRENT_PROJECT_VERSION: "89"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TripDataHub/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: TripData Hub
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: TripDataHub/TripDataHub.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 54WZM2U9MK
    # The app owns its extensions. XcodeGen only emits the "Embed App Extensions" copy phase
    # (PBXCopyFilesBuildPhase, dstSubfolderSpec 13 = PlugIns) on an application target that
    # *depends on* an app-extension target. With the dependency declared the other way round the
    # app had an empty build graph, so `xcodebuild archive` produced an .app with no PlugIns
    # directory and neither .appex was built, embedded or signed.
    dependencies:
      - target: TripDataShareActionExtension
        embed: true
        codeSign: true
      - target: TripDataCountdownWidgetExtension
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - TripDataHubTests
        - TripDataHubUITests

  TripDataShareActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TripDataShareActionExtension
      # Shared App Group handoff contract, compiled into both the app and this extension so the
      # identifiers and the on-disk queue format cannot drift. Dual target membership of one file,
      # not a copy: there is exactly one definition of `AppGroupImportHandoff` in the repository.
      # The file imports only Foundation and references no app-only type, so nothing else is
      # pulled into the extension.
      - path: TripDataHub/Services/AppGroupImportHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.ShareAction
        PRODUCT_NAME: "TripDataShareActionExtension"
        MARKETING_VERSION: "1.3.3"
        CURRENT_PROJECT_VERSION: "89"
        INFOPLIST_FILE: TripDataShareActionExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripDataShareActionExtension/TripDataShareActionExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 54WZM2U9MK
        SKIP_INSTALL: YES
    # No dependency on TripDataHub. An extension must not depend on its host app to reach shared
    # code — that inverts the embed relationship and would now also be a dependency cycle, since
    # the app depends on this target. Shared code is reached by file membership above.

  TripDataCountdownWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TripDataCountdownWidgetExtension
      # Shared operational state and countdown payloads compiled into both the app and extension.
      # Dual target membership, not copies: operational state, Home Widget presentation policy,
      # and snapshot payload contracts must stay byte-identical on both sides of the App Group.
      - path: TripDataHub/Models/FlightOperationalState.swift
      - path: TripDataHub/Models/FlightCountdownSharedModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.CountdownWidget
        PRODUCT_NAME: "TripDataCountdownWidgetExtension"
        MARKETING_VERSION: "1.3.3"
        CURRENT_PROJECT_VERSION: "89"
        INFOPLIST_FILE: TripDataCountdownWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripDataCountdownWidgetExtension/TripDataCountdownWidgetExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 54WZM2U9MK
        SKIP_INSTALL: YES
    # No dependency on TripDataHub — see the note on the Share Action target.

  TripDataHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TripDataHubTests
    dependencies:
      - target: TripDataHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.Tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 54WZM2U9MK
        GENERATE_INFOPLIST_FILE: YES
        # Hardcoded to match PRODUCT_NAME "TripDataHub". If PRODUCT_NAME changes, update this path.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TripDataHub.app/TripDataHub"
        BUNDLE_LOADER: $(TEST_HOST)

  TripDataHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TripDataHubUITests
    dependencies:
      - target: TripDataHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.UITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 54WZM2U9MK
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TripDataHub
