name: TripDataHub
options:
  minimumXcodeGenVersion: 2.44.0
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  TripDataHub:
    type: application
    platform: iOS
    sources:
      - path: TripDataHub
        excludes:
          - "**/*.md"
    resources:
      - path: TripDataHub/Resources/AdminPolicy.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule
        PRODUCT_NAME: TripDataHub
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "42"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TripDataHub/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: TripData Hub
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UIAppFonts:
          - Resources/Fonts/MaterialIcons.ttf
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: TripDataHub/TripDataHub.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - TripDataHubTests
        - TripDataHubUITests

  TripDataShareActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TripDataShareActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.ShareAction
        PRODUCT_NAME: "TripDataShareActionExtension"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "42"
        INFOPLIST_FILE: TripDataShareActionExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripDataShareActionExtension/TripDataShareActionExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
    dependencies:
      - target: TripDataHub

  TripDataCountdownWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TripDataCountdownWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.CountdownWidget
        PRODUCT_NAME: "TripDataCountdownWidgetExtension"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "42"
        INFOPLIST_FILE: TripDataCountdownWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripDataCountdownWidgetExtension/TripDataCountdownWidgetExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
    dependencies:
      - target: TripDataHub

  TripDataHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TripDataHubTests
    dependencies:
      - target: TripDataHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.Tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        # Hardcoded to match PRODUCT_NAME "TripDataHub". If PRODUCT_NAME changes, update this path.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TripDataHub.app/TripDataHub"
        BUNDLE_LOADER: $(TEST_HOST)

  TripDataHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TripDataHubUITests
    dependencies:
      - target: TripDataHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfune.BidProSchedule.UITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TripDataHub
